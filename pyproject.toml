[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pipeprof"
version = "1.0.1"
description = "Profile bioinformatics jobs before, during and after Slurm submission, with structured logging."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Amir Daneshpajouh" }]
keywords = ["slurm", "hpc", "bioinformatics", "profiling", "nextflow", "snakemake", "logging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = [
    "psutil>=5.9",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-psutil",
    "hypothesis>=6",
]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]

[project.scripts]
pipeprof = "pipeprof.cli:main"

[project.urls]
Homepage = "https://github.com/Daneshpajouh/pipeprof"
Documentation = "https://github.com/Daneshpajouh/pipeprof/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeprof"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "CHANGELOG.md", "LICENSE", "CITATION.cff"]

[tool.ruff]
line-length = 99
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF", "PTH", "C4", "PL"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "PLR0912", "PLR0914", "PLR0915", "PLR0911", "PLR6301"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "realdata: runs real tools on public data under PIPEPROF_DATA_DIR (skipped unless set)",
    "docker: needs a running Docker daemon and the pinned Slurm image (skipped unless PIPEPROF_DOCKER_SLURM=1)",
]

[tool.coverage.run]
source = ["pipeprof"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:"]
