# Draft for conda-forge staged-recipes. Fill sha256 from the PyPI sdist after
# the first release (`pip download pipeprof==1.0.1 --no-binary :all:`).
{% set name = "pipeprof" %}
{% set version = "1.0.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pipeprof-{{ version }}.tar.gz
  sha256: SHA256_OF_THE_PYPI_SDIST

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - pipeprof = pipeprof.cli:main

requirements:
  host:
    - python >=3.11
    - hatchling >=1.24
    - pip
  run:
    - python >=3.11
    - psutil >=5.9
    - typer >=0.12
    - rich >=13

test:
  imports:
    - pipeprof
  commands:
    - pipeprof --version
    - pipeprof report --show-sacct
  requires:
    - pip

about:
  home: https://github.com/Daneshpajouh/pipeprof
  summary: Profile bioinformatics jobs before, during and after Slurm submission.
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - Daneshpajouh
